
name: NEXUNO Offline Sync Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  offline-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start NEXUNO server
        run: |
          npm start > server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/catalog; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/catalog

      - name: Run offline sync test
        run: npm test

      - name: Show server log if test fails
        if: failure()
        run: cat server.log
        
